name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: donysh-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: HesabYar.Web
        run: npm install --no-audit --no-fund

      - name: Build Tailwind CSS
        working-directory: HesabYar.Web
        run: npm run build:css

      - name: Restore .NET packages
        run: dotnet restore HesabYar.sln

      - name: Build .NET project
        run: dotnet build HesabYar.sln --configuration Release --no-restore

      - name: Validate Docker image
        run: docker build --file HesabYar.Web/Dockerfile --tag donysh-ci:${{ github.sha }} .

  deploy:
    name: Deploy to production
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/donysh_deploy_key
          chmod 600 ~/.ssh/donysh_deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Pull changes and deploy on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_PATH: ${{ secrets.SERVER_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/donysh_deploy_key \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "cd '$SERVER_APP_PATH' && DEPLOY_BRANCH=main bash scripts/server-deploy.sh"
