name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: donysh-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always
      NPM_CONFIG_FETCH_RETRIES: 3
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000
      NPM_CONFIG_FETCH_TIMEOUT: 120000
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            HesabYar.Web/package-lock.json
            Donysh.Auth/package-lock.json
            Donysh.Landing/package-lock.json
            Donysh.Life/package-lock.json

      - name: Verify npm registry sources
        run: python scripts/validate_project.py

      - name: Validate deployment scripts
        run: bash -n scripts/*.sh

      - name: Install frontend dependencies
        working-directory: HesabYar.Web
        run: timeout 180s npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit frontend dependencies
        working-directory: HesabYar.Web
        run: npm audit --audit-level=high

      - name: Build Tailwind CSS
        working-directory: HesabYar.Web
        run: npm run build:css

      - name: Install Auth frontend dependencies
        working-directory: Donysh.Auth
        run: timeout 180s npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit Auth frontend dependencies
        working-directory: Donysh.Auth
        run: npm audit --audit-level=high

      - name: Build Auth Tailwind CSS
        working-directory: Donysh.Auth
        run: npm run build:css

      - name: Install Landing frontend dependencies
        working-directory: Donysh.Landing
        run: timeout 180s npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit Landing frontend dependencies
        working-directory: Donysh.Landing
        run: npm audit --audit-level=high

      - name: Build Landing Tailwind CSS
        working-directory: Donysh.Landing
        run: npm run build:css

      - name: Install Life frontend dependencies
        working-directory: Donysh.Life
        run: timeout 180s npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit Life frontend dependencies
        working-directory: Donysh.Life
        run: npm audit --audit-level=high

      - name: Build Life Tailwind CSS
        working-directory: Donysh.Life
        run: npm run build:css

      - name: Verify committed frontend assets are current
        run: |
          git diff --exit-code -- \
            HesabYar.Web/wwwroot/css/app.css \
            Donysh.Auth/wwwroot/css/app.css \
            Donysh.Landing/wwwroot/css/app.css \
            Donysh.Life/wwwroot/css/app.css

      - name: Restore .NET packages
        run: dotnet restore HesabYar.sln

      - name: Build .NET project
        run: dotnet build HesabYar.sln --configuration Release --no-restore

      - name: Run API and security regression tests
        env:
          DONYSH_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=local-test-only
        run: dotnet run --project Donysh.Api.Tests --configuration Release

      - name: Run SMS parser and queue tests
        run: dotnet run --project Donysh.Sms.Tests --configuration Release

      - name: Run Auth protocol and security tests
        env:
          DONYSH_AUTH_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=local-test-only
        run: dotnet run --project Donysh.Auth.Tests --configuration Release

      - name: Run Landing rendering and security tests
        run: dotnet run --project Donysh.Landing.Tests --configuration Release

      - name: Run Life shell and security tests
        env:
          DONYSH_LIFE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=local-test-only
        run: dotnet run --project Donysh.Life.Tests --configuration Release

      - name: Validate Docker image
        run: docker build --file HesabYar.Web/Dockerfile --tag donysh-ci:${{ github.sha }} .

      - name: Validate Auth Docker image
        run: docker build --file Donysh.Auth/Dockerfile --tag donysh-auth-ci:${{ github.sha }} .

      - name: Validate Landing Docker image
        run: docker build --file Donysh.Landing/Dockerfile --tag donysh-landing-ci:${{ github.sha }} .

      - name: Validate Life Docker image
        run: docker build --file Donysh.Life/Dockerfile --tag donysh-life-ci:${{ github.sha }} .

      - name: Validate reverse proxy configuration
        run: |
          docker run --rm \
            -e DOMAIN=donysh.test \
            -e FINANCE_DOMAIN=finance.donysh.test \
            -e AUTH_DOMAIN=auth.donysh.test \
            -e LIFE_DOMAIN=life.donysh.test \
            -e ACME_EMAIL=admin@donysh.test \
            -v "$PWD/Caddyfile.platform:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate identity migration Docker image
        run: docker build --file Donysh.IdentityMigration/Dockerfile --tag donysh-identity-migration-ci:${{ github.sha }} .

  deploy:
    name: Deploy to production
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/donysh_deploy_key
          chmod 600 ~/.ssh/donysh_deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Pull changes and deploy on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_PATH: ${{ secrets.SERVER_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/donysh_deploy_key \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "cd '$SERVER_APP_PATH' && APP_DIR='$SERVER_APP_PATH' DEPLOY_BRANCH=main bash -s" \
            < scripts/server-deploy.sh
