name: Android companion test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.103
            9.0.317
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Parser and persistent outbox tests
        working-directory: Donysh.Companion
        run: dotnet run --project ../Donysh.Sms.Tests --configuration Release
      - name: API and PostgreSQL integration tests
        env:
          DONYSH_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=local-test-only
        run: dotnet run --project Donysh.Api.Tests --configuration Release --no-launch-profile
      - name: Install Android workload
        working-directory: Donysh.Companion
        run: dotnet workload install maui-android
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build standalone debug APK (not for public distribution)
        working-directory: Donysh.Companion
        run: >-
          dotnet build Donysh.Companion.csproj -c Debug -f net9.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
          -p:EmbedAssembliesIntoApk=true
      - uses: actions/upload-artifact@v4
        with:
          name: donysh-companion-test-apk
          path: Donysh.Companion/bin/Debug/net9.0-android/*-Signed.apk
          if-no-files-found: error
          retention-days: 7
