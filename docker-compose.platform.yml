name: hesabyar

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hesabyar}
      POSTGRES_USER: ${POSTGRES_USER:-hesabyar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finance-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hesabyar} -d ${POSTGRES_DB:-hesabyar}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: HesabYar.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${DOMAIN:?DOMAIN is required};${FINANCE_DOMAIN:?FINANCE_DOMAIN is required}
      ReverseProxy__Enabled: "true"
      DataProtection__KeysPath: /keys
      CentralAuth__Enabled: ${CENTRAL_AUTH_ENABLED:-false}
      CentralAuth__Authority: https://${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      CentralAuth__ClientId: finance-web
      CentralAuth__ClientSecret: ${FINANCE_OIDC_CLIENT_SECRET:?FINANCE_OIDC_CLIENT_SECRET is required}
      CentralAuth__RequireHttpsMetadata: "true"
      TZ: ${TZ:-Asia/Tehran}
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-hesabyar};Username=${POSTGRES_USER:-hesabyar};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required};Pooling=true;Maximum Pool Size=100;Timeout=15;Command Timeout=30;Include Error Detail=false
    expose:
      - "8080"
    volumes:
      - dataprotection_keys:/keys
    networks:
      - finance-backend
      - frontend
    logging: *default-logging

  auth-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-donysh_auth}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-donysh_auth}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - auth-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER:-donysh_auth} -d ${AUTH_POSTGRES_DB:-donysh_auth}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *default-logging

  auth:
    build:
      context: .
      dockerfile: Donysh.Auth/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      ReverseProxy__Enabled: "true"
      Database__ApplyMigrations: "true"
      DataProtection__KeysPath: /keys
      Features__PublicRegistration: "false"
      Features__PasswordRecovery: "false"
      Features__LegacyIdentityImportCompleted: ${LEGACY_IDENTITY_IMPORT_COMPLETED:-false}
      OidcClients__0__ClientId: finance-web
      OidcClients__0__DisplayName: Donysh Finance
      OidcClients__0__ClientSecret: ${FINANCE_OIDC_CLIENT_SECRET:?FINANCE_OIDC_CLIENT_SECRET is required}
      OidcClients__0__PublicClient: "false"
      OidcClients__0__RedirectUris__0: https://${DOMAIN:?DOMAIN is required}/signin-oidc
      OidcClients__0__RedirectUris__1: https://${FINANCE_DOMAIN:?FINANCE_DOMAIN is required}/signin-oidc
      OidcClients__0__PostLogoutRedirectUris__0: https://${DOMAIN:?DOMAIN is required}/signout-callback-oidc
      OidcClients__0__PostLogoutRedirectUris__1: https://${FINANCE_DOMAIN:?FINANCE_DOMAIN is required}/signout-callback-oidc
      OidcClients__1__ClientId: life-web
      OidcClients__1__DisplayName: Donysh Life
      OidcClients__1__ClientSecret: ${LIFE_OIDC_CLIENT_SECRET:?LIFE_OIDC_CLIENT_SECRET is required}
      OidcClients__1__PublicClient: "false"
      OidcClients__1__RedirectUris__0: https://${LIFE_DOMAIN:?LIFE_DOMAIN is required}/signin-oidc
      OidcClients__1__PostLogoutRedirectUris__0: https://${LIFE_DOMAIN:?LIFE_DOMAIN is required}/signout-callback-oidc
      OpenIddict__SigningCertificate__Path: /certs/signing.pfx
      OpenIddict__SigningCertificate__Password: ${AUTH_SIGNING_CERT_PASSWORD:?AUTH_SIGNING_CERT_PASSWORD is required}
      OpenIddict__EncryptionCertificate__Path: /certs/encryption.pfx
      OpenIddict__EncryptionCertificate__Password: ${AUTH_ENCRYPTION_CERT_PASSWORD:?AUTH_ENCRYPTION_CERT_PASSWORD is required}
      TZ: ${TZ:-Asia/Tehran}
      ConnectionStrings__AuthConnection: >-
        Host=auth-db;Port=5432;Database=${AUTH_POSTGRES_DB:-donysh_auth};Username=${AUTH_POSTGRES_USER:-donysh_auth};Password=${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required};Pooling=true;Maximum Pool Size=30;Timeout=15;Command Timeout=30;Include Error Detail=false
    expose:
      - "8080"
    volumes:
      - auth_dataprotection_keys:/keys
      - ./secrets/auth:/certs:ro
    networks:
      - auth-backend
      - frontend
    logging: *default-logging

  identity-migration:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Donysh.IdentityMigration/Dockerfile
    environment:
      SOURCE_CONNECTION_STRING: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-hesabyar};Username=${POSTGRES_USER:-hesabyar};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required};Pooling=false;Timeout=15;Command Timeout=30;Include Error Detail=false
      TARGET_CONNECTION_STRING: >-
        Host=auth-db;Port=5432;Database=${AUTH_POSTGRES_DB:-donysh_auth};Username=${AUTH_POSTGRES_USER:-donysh_auth};Password=${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required};Pooling=false;Timeout=15;Command Timeout=30;Include Error Detail=false
    networks:
      - finance-backend
      - auth-backend
    logging: *default-logging

  landing:
    build:
      context: .
      dockerfile: Donysh.Landing/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${DOMAIN:?DOMAIN is required}
      ReverseProxy__Enabled: "true"
      Products__FinanceUrl: https://${FINANCE_DOMAIN:?FINANCE_DOMAIN is required}
      Products__AuthUrl: https://${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      Products__LifeUrl: https://${LIFE_DOMAIN:?LIFE_DOMAIN is required}
      TZ: ${TZ:-Asia/Tehran}
    expose:
      - "8080"
    networks:
      - frontend
    logging: *default-logging

  life-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LIFE_POSTGRES_DB:-donysh_life}
      POSTGRES_USER: ${LIFE_POSTGRES_USER:-donysh_life}
      POSTGRES_PASSWORD: ${LIFE_POSTGRES_PASSWORD:?LIFE_POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - life_postgres_data:/var/lib/postgresql/data
    networks:
      - life-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LIFE_POSTGRES_USER:-donysh_life} -d ${LIFE_POSTGRES_DB:-donysh_life}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *default-logging

  life:
    build:
      context: .
      dockerfile: Donysh.Life/Dockerfile
    restart: unless-stopped
    depends_on:
      life-db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${LIFE_DOMAIN:?LIFE_DOMAIN is required}
      ReverseProxy__Enabled: "true"
      Database__ApplyMigrations: "true"
      DataProtection__KeysPath: /keys
      CentralAuth__Authority: https://${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      CentralAuth__ClientId: life-web
      CentralAuth__ClientSecret: ${LIFE_OIDC_CLIENT_SECRET:?LIFE_OIDC_CLIENT_SECRET is required}
      CentralAuth__RequireHttpsMetadata: "true"
      TZ: ${TZ:-Asia/Tehran}
      ConnectionStrings__LifeConnection: >-
        Host=life-db;Port=5432;Database=${LIFE_POSTGRES_DB:-donysh_life};Username=${LIFE_POSTGRES_USER:-donysh_life};Password=${LIFE_POSTGRES_PASSWORD:?LIFE_POSTGRES_PASSWORD is required};Pooling=true;Maximum Pool Size=30;Timeout=15;Command Timeout=30;Include Error Detail=false
    expose:
      - "8080"
    volumes:
      - life_dataprotection_keys:/keys
    networks:
      - life-backend
      - frontend
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      auth:
        condition: service_started
      landing:
        condition: service_started
      life:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      FINANCE_DOMAIN: ${FINANCE_DOMAIN:?FINANCE_DOMAIN is required}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      LIFE_DOMAIN: ${LIFE_DOMAIN:?LIFE_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.platform:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - finance-backend
      - frontend
    logging: *default-logging

volumes:
  postgres_data:
  dataprotection_keys:
  auth_postgres_data:
  auth_dataprotection_keys:
  life_postgres_data:
  life_dataprotection_keys:
  caddy_data:
  caddy_config:

networks:
  frontend:
  finance-backend:
    internal: true
  auth-backend:
    internal: true
  life-backend:
    internal: true
